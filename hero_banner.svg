<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a24"/>
      <stop offset="55%" stop-color="#241f2c"/>
      <stop offset="100%" stop-color="#2a1f2a"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4fb0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff4fb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bd93f9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="underline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4fb0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff4fb0" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="240" rx="28" fill="url(#bgGrad)"/>
  <circle cx="790" cy="60" r="180" fill="url(#glowPink)" filter="url(#soft)"/>
  <circle cx="110" cy="215" r="110" fill="url(#glowPurple)" filter="url(#soft)"/>

  <!-- one elegant sparkle cluster, top right -->
  <g fill="#ff4fb0">
    <path d="M820,45 L823,53.5 L831.5,56.5 L823,59.5 L820,68 L817,59.5 L808.5,56.5 L817,53.5 Z">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M770,80 L771.8,84.4 L776,86 L771.8,87.6 L770,92 L768.2,87.6 L764,86 L768.2,84.4 Z">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M855,95 L856.6,99.4 L861,101 L856.6,102.6 L855,107 L853.4,102.6 L849,101 L853.4,99.4 Z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- soft twinkle dust, arranged as a graceful arc -->
  <g fill="#f8f8f2">
    <circle cx="740" cy="35" r="1.5"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="140" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="60" r="1.4"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="110" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- single quiet purple accent, lower left -->
  <g fill="#bd93f9" opacity="0.85">
    <path d="M55,140 L56.6,144.4 L61,146 L56.6,147.6 L55,152 L53.4,147.6 L49,146 L53.4,144.4 Z">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="70" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#ff4fb0">
    Sena Demirci
  </text>
  <rect x="72" y="136" width="200" height="2" fill="url(#underline)"/>
  <text x="72" y="166" font-family="Verdana, sans-serif" font-size="17" fill="#f8f8f2" letter-spacing="1.5">
    Software Engineer
  </text>
</svg>
